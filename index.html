<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Birthday Surprise</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Mali:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --wine: #8e2326;
      --wine-d: #6a1719;
      --paper: #f6ecd6;
      --rose: #d98e8e;
      --gold: #d8b25a;
      --ink: #4a1c1c;
      --script: 'Dancing Script', 'Mali', cursive;
      --body: 'Mali', 'Sarabun', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: var(--body);
      color: var(--ink)
    }

    body {
      background: var(--wine)
    }

    .scene {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px
    }

    .scene.on {
      display: flex;
      animation: fade .8s ease
    }

    @keyframes fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    /* 1 PASSCODE */
    #lock {
      background: radial-gradient(circle at 30% 20%, #a52c30, var(--wine) 60%, var(--wine-d));
      flex-direction: row;
      gap: 6vw;
      flex-wrap: wrap;
      overflow: auto
    }

    .polaroid {
      background: #f8f3e6;
      padding: 14px 14px 48px;
      width: min(300px, 70vw);
      transform: rotate(-4deg);
      box-shadow: 0 18px 40px #0006;
      position: relative
    }

    .polaroid .ph {
      aspect-ratio: 4/5;
      background: linear-gradient(160deg, #5a2a2a, #2a1212);
      background-size: cover;
      background-position: center
    }

    .polaroid p {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: var(--script);
      font-size: 22px
    }

    .polaroid:before {
      content: "🎀";
      position: absolute;
      top: -22px;
      left: -16px;
      font-size: 44px
    }

    .pad {
      text-align: center;
      color: #fff
    }

    .pad h2 {
      font-size: 14px;
      font-weight: 600;
      margin: 6px 0 14px;
      opacity: .9
    }

    .dots {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px
    }

    .dots i {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 2px solid #fff6;
      background: #ffffff1a;
      display: grid;
      place-items: center;
      font-style: normal;
      color: #fff;
      transition: .2s
    }

    .dots i.f {
      background: #fff3;
      border-color: #fff
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      gap: 12px;
      justify-content: center
    }

    .keys button {
      height: 64px;
      border-radius: 50%;
      border: 0;
      background: var(--rose);
      color: #fff;
      font: 600 22px var(--body);
      cursor: pointer;
      box-shadow: 0 4px 0 #a85d5d;
      transition: transform .1s
    }

    .keys button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #a85d5d
    }

    .keys .ghost {
      background: transparent;
      box-shadow: none
    }

    .shake {
      animation: shake .45s
    }

    @keyframes shake {
      25% {
        transform: translateX(-10px)
      }

      75% {
        transform: translateX(10px)
      }
    }

    #hint {
      height: 20px;
      margin-top: 16px;
      font-size: 13px;
      color: #ffd9d9
    }

    /* 2 LOADING */
    #load {
      background: #f7f2ea;
      text-align: center
    }

    #load .hi {
      font-family: var(--script);
      font-size: 34px;
      color: var(--wine)
    }

    #load .cake {
      font-size: 64px;
      animation: bob 1.2s ease-in-out infinite
    }

    @keyframes bob {
      50% {
        transform: translateY(-10px)
      }
    }

    #load p {
      margin: 8px 0 14px;
      font-size: 15px
    }

    .bar {
      width: min(260px, 70vw);
      height: 10px;
      border-radius: 9px;
      background: #e4d7e8;
      overflow: hidden
    }

    .bar b {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #6b3fa0, #c07ad6);
      transition: width .2s
    }

    .float {
      position: absolute;
      font-size: 22px;
      animation: drift 6s ease-in-out infinite;
      opacity: .8
    }

    @keyframes drift {
      50% {
        transform: translateY(-18px) rotate(12deg)
      }
    }

    /* 3 ENVELOPE */
    #env {
      background: var(--wine)
    }

    .sheet {
      width: min(320px, 82vw);
      aspect-ratio: 1;
      background: var(--paper);
      box-shadow: 0 20px 50px #0007;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px
    }

    .sheet h1 {
      font-family: var(--script);
      font-size: 34px;
      color: var(--wine);
      text-align: center;
      line-height: 1.1
    }

    .envelope {
      width: 60%;
      aspect-ratio: 1.5;
      background: #a82b2e;
      position: relative;
      cursor: pointer;
      box-shadow: 0 8px 18px #0004
    }

    .envelope .flap {
      position: absolute;
      inset: 0;
      background: #8a1f22;
      clip-path: polygon(0 0, 100% 0, 50% 62%);
      transform-origin: top;
      transition: transform .7s
    }

    .envelope:after {
      content: "";
      position: absolute;
      inset: 0;
      background: #b73538;
      clip-path: polygon(0 100%, 50% 40%, 100% 100%)
    }

    .seal {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 44px;
      height: 44px;
      margin: -22px;
      border-radius: 50%;
      z-index: 3;
      background: radial-gradient(circle at 35% 30%, #f1d98f, var(--gold) 60%, #a98128);
      box-shadow: 0 3px 8px #0006;
      transition: .4s;
      animation: pulse 1.6s infinite
    }

    @keyframes pulse {
      50% {
        transform: scale(1.1)
      }
    }

    .envelope.open .flap {
      transform: rotateX(180deg)
    }

    .envelope.open .seal {
      opacity: 0;
      transform: scale(2)
    }

    .sheet small {
      font-size: 11px;
      opacity: .6
    }

    /* 3.5 HERO */
    #hero {
      background: radial-gradient(circle at 20% 30%, #c9953a55 0 6%, transparent 7%), radial-gradient(circle at 70% 20%, #e8b45a44 0 5%, transparent 6%), radial-gradient(circle at 45% 12%, #e8b45a33 0 4%, transparent 5%), linear-gradient(160deg, #3b2a20, #14100d);
      background-size: cover;
      background-position: center;
      text-align: center;
      color: #fff
    }

    #hero:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(#0009, #0003 40%, #0009)
    }

    #hero>* {
      position: relative;
      animation: heroin 1.4s ease both
    }

    #hero .date {
      font-size: 12px;
      letter-spacing: 3px;
      opacity: .85;
      animation-delay: .2s
    }

    #hero h1 {
      font-family: var(--script);
      font-size: clamp(40px, 9vw, 84px);
      line-height: 1.1;
      margin: 8px 0 12px;
      color: #fff3d6;
      text-shadow: 0 0 22px #ffc65f99, 0 2px 10px #000a;
      animation-delay: .5s
    }

    #hero .sub {
      font-family: var(--script);
      font-size: clamp(16px, 3.2vw, 24px);
      max-width: min(560px, 86vw);
      line-height: 1.5;
      color: #ffe8b8;
      text-shadow: 0 2px 8px #000a;
      animation-delay: .9s
    }

    #hero .read {
      margin-top: 30px;
      padding: 12px 28px;
      border-radius: 30px;
      border: 1px solid #fff9;
      background: #ffffff26;
      backdrop-filter: blur(6px);
      color: #fff;
      font: 600 14px var(--body);
      cursor: pointer;
      animation-delay: 1.3s
    }

    #hero .read:hover {
      background: #ffffff40
    }

    @keyframes heroin {
      from {
        opacity: 0;
        transform: translateY(14px);
        filter: blur(6px)
      }

      to {
        opacity: 1;
        transform: none;
        filter: none
      }
    }

    /* 4 LETTER */
    #letter {
      background: var(--wine);
      overflow: auto;
      justify-content: flex-start;
      padding: 30px 16px
    }

    .wrap {
      display: flex;
      gap: 22px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 900px;
      margin: auto
    }

    .card {
      background: var(--paper);
      width: min(420px, 92vw);
      padding: 34px 26px 26px;
      position: relative;
      box-shadow: 0 14px 34px #0006;
      clip-path: polygon(0 1%, 3% 0, 6% 1%, 9% 0, 12% 1%, 15% 0, 18% 1%, 21% 0, 24% 1%, 27% 0, 30% 1%, 33% 0, 36% 1%, 39% 0, 42% 1%, 45% 0, 48% 1%, 51% 0, 54% 1%, 57% 0, 60% 1%, 63% 0, 66% 1%, 69% 0, 72% 1%, 75% 0, 78% 1%, 81% 0, 84% 1%, 87% 0, 90% 1%, 93% 0, 96% 1%, 100% 0, 100% 99%, 97% 100%, 94% 99%, 91% 100%, 88% 99%, 85% 100%, 82% 99%, 79% 100%, 76% 99%, 73% 100%, 70% 99%, 67% 100%, 64% 99%, 61% 100%, 58% 99%, 55% 100%, 52% 99%, 49% 100%, 46% 99%, 43% 100%, 40% 99%, 37% 100%, 34% 99%, 31% 100%, 28% 99%, 25% 100%, 22% 99%, 19% 100%, 16% 99%, 13% 100%, 10% 99%, 7% 100%, 4% 99%, 0 100%)
    }

    .card h2 {
      font-family: var(--script);
      font-size: 30px;
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: 1px
    }

    .card h2 small {
      display: block;
      font-size: 12px;
      letter-spacing: 4px;
      font-family: var(--body)
    }

    .card p {
      font-size: 14px;
      line-height: 1.85;
      margin-bottom: 12px;
      white-space: pre-line
    }

    .photos {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: min(190px, 60vw)
    }

    .photos .ph {
      background: #fff;
      padding: 5px;
      box-shadow: 0 6px 14px #0006
    }

    .photos .ph div {
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, #7a3a3a, #3a1b1b);
      background-size: cover;
      background-position: center
    }

    .photos .ph:nth-child(odd) {
      transform: rotate(2deg)
    }

    .photos .ph:nth-child(even) {
      transform: rotate(-2deg)
    }

    .next {
      margin-top: 18px;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--wine);
      font: 600 14px var(--body);
      color: var(--wine);
      cursor: pointer
    }

    .hearts span {
      position: fixed;
      bottom: -30px;
      animation: up 7s linear forwards;
      pointer-events: none
    }

    @keyframes up {
      to {
        transform: translateY(-110vh) rotate(40deg);
        opacity: 0
      }
    }

    /* 5 CAKE */
    #cake {
      background: #0a0710;
      color: #fff;
      text-align: center;
      overflow: hidden
    }

    #cake h2 {
      font-family: var(--script);
      font-size: 34px;
      color: #ffe9b5;
      margin-bottom: 10px;
      text-shadow: 0 0 18px #ffcf6a88
    }

    .cakebox {
      position: relative;
      width: 260px;
      height: 230px;
      margin: 34px 0 6px
    }

    .cakebox:before {
      content: "";
      position: absolute;
      left: 50%;
      top: -60px;
      width: 400px;
      height: 400px;
      margin-left: -200px;
      background: radial-gradient(circle, #ffb34738, transparent 60%);
      animation: glow 1.3s ease-in-out infinite alternate;
      transition: opacity .8s;
      pointer-events: none
    }

    @keyframes glow {
      from {
        opacity: .65;
        transform: scale(.95)
      }

      to {
        opacity: 1;
        transform: scale(1.05)
      }
    }

    .cakebox.out:before {
      opacity: 0;
      animation: none
    }

    .plate {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 260px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(ellipse, #f7f7f7, #b4b4c2);
      box-shadow: 0 6px 14px #000a
    }

    .tier {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 10px 10px 6px 6px;
      box-shadow: inset 0 -10px 14px #0002
    }

    .t1 {
      bottom: 8px;
      width: 220px;
      height: 76px;
      background: linear-gradient(#f2a7b8, #d9758f)
    }

    .t2 {
      bottom: 80px;
      width: 150px;
      height: 60px;
      background: linear-gradient(#fff3dc, #f0d9b5)
    }

    .tier:before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 16px;
      border-radius: 10px 10px 0 0;
      background: #fff
    }

    .tier:after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 15px;
      height: 12px;
      background: radial-gradient(circle at 10px 0, #fff 9px, transparent 10px) 0 0/20px 12px repeat-x
    }

    .candles {
      position: absolute;
      left: 50%;
      bottom: 138px;
      transform: translateX(-50%);
      display: flex;
      gap: 26px;
      align-items: flex-end
    }

    .candle {
      position: relative;
      width: 11px;
      height: 44px;
      border-radius: 3px;
      background: repeating-linear-gradient(135deg, #fff 0 6px, #ff8fb1 6px 12px);
      box-shadow: inset -2px 0 3px #0003
    }

    .candle:nth-child(2) {
      height: 54px
    }

    .wick {
      position: absolute;
      left: 50%;
      bottom: 100%;
      width: 2px;
      height: 6px;
      margin-left: -1px;
      background: #2a1a12
    }

    .flame {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 4px);
      width: 15px;
      height: 30px;
      margin-left: -7.5px;
      border-radius: 50% 50% 50% 50%/65% 65% 35% 35%;
      background: radial-gradient(ellipse at 50% 82%, #fffbe0 0 18%, #ffd54a 45%, #ff9a1f 80%, #ff6a00);
      box-shadow: 0 0 14px 5px #ffae3a99, 0 0 36px 14px #ff8a0044;
      transform-origin: 50% 100%;
      animation: flick .5s ease-in-out infinite alternate;
      transition: transform .5s, opacity .5s
    }

    .candle:nth-child(2) .flame {
      animation-duration: .42s;
      animation-delay: -.2s
    }

    .candle:nth-child(3) .flame {
      animation-duration: .58s;
      animation-delay: -.35s
    }

    @keyframes flick {
      0% {
        transform: scale(1, 1) rotate(-3deg)
      }

      30% {
        transform: scale(.92, 1.1) rotate(2deg) translateX(.5px)
      }

      60% {
        transform: scale(1.06, .93) rotate(-2deg)
      }

      100% {
        transform: scale(.96, 1.07) rotate(3deg)
      }
    }

    .blow .flame {
      animation: lean .22s ease-in-out infinite alternate
    }

    @keyframes lean {
      from {
        transform: scale(.85, 1.1) rotate(-18deg)
      }

      to {
        transform: scale(.8, .95) rotate(-34deg)
      }
    }

    .out .flame {
      animation: none;
      transform: scale(.1);
      opacity: 0
    }

    .smoke {
      position: absolute;
      left: 50%;
      bottom: 100%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background: #ffffff66;
      filter: blur(4px);
      opacity: 0
    }

    .out .smoke {
      animation: smoke 2.4s ease-out
    }

    @keyframes smoke {
      0% {
        opacity: .7;
        transform: translate(0, 0) scale(.5)
      }

      100% {
        opacity: 0;
        transform: translate(10px, -80px) scale(2.6)
      }
    }

    #count {
      font: 700 110px var(--script);
      color: #ffd77a;
      height: 130px;
      text-shadow: 0 0 30px #ffb347
    }

    #count.pop {
      animation: pop .9s
    }

    @keyframes pop {
      0% {
        transform: scale(.3);
        opacity: 0
      }

      30% {
        transform: scale(1.2);
        opacity: 1
      }

      100% {
        transform: scale(1);
        opacity: .9
      }
    }

    #go {
      background: var(--rose);
      color: #fff;
      border: 0;
      border-radius: 30px;
      padding: 14px 30px;
      font: 600 16px var(--body);
      cursor: pointer;
      box-shadow: 0 0 24px #d98e8e66
    }

    #wishes {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2
    }

    .wish {
      position: absolute;
      left: 50%;
      font-family: var(--script);
      text-shadow: 0 0 14px #ff9ad0;
      transform: translate(-50%, 0);
      animation: wishup 4.5s ease-out forwards;
      white-space: nowrap
    }

    @keyframes wishup {
      0% {
        opacity: 0;
        transform: translate(-50%, 30px) scale(.6)
      }

      15% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1.1)
      }

      80% {
        opacity: 1
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -40px)
      }
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01s !important
      }
    }
  </style>
</head>

<body>

  <!-- 1 PASSCODE -->
  <section class="scene on" id="lock">
    <div class="polaroid">
      <div class="ph" id="lockPhoto"></div>
      <p id="lockCaption"></p>
    </div>
    <div class="pad">
      <div style="font-size:26px">🔒</div>
      <h2>ใส่วันเกิดของอ้วน (วว/ดด/ปป)</h2>
      <div class="dots" id="dots"></div>
      <div class="keys" id="keys"></div>
      <div id="hint"></div>
    </div>
  </section>

  <!-- 2 LOADING -->
  <section class="scene" id="load">
    <div class="float" style="top:12%;left:10%">🎀</div>
    <div class="float" style="top:70%;left:14%;animation-delay:1s">🌸</div>
    <div class="float" style="top:20%;right:12%;animation-delay:2s">⭐</div>
    <div class="float" style="top:75%;right:10%;animation-delay:.5s">🎀</div>
    <div class="hi" id="hiText"></div>
    <div class="cake">🎂</div>
    <p>Loading your birthday surprise...</p>
    <div class="bar"><b id="barFill"></b></div>
  </section>

  <!-- 3 ENVELOPE -->
  <section class="scene" id="env">
    <div class="sheet">
      <h1 id="envTitle"></h1>
      <div class="envelope" id="envelope">
        <div class="flap"></div>
        <div class="seal"></div>
      </div>
      <small>แตะที่ตราประทับเพื่อเปิดของขวัญ</small>
    </div>
  </section>

  <!-- 3.5 HERO -->
  <section class="scene" id="hero">
    <div class="date" id="heroDate"></div>
    <h1 id="heroTitle"></h1>
    <div class="sub" id="heroSub"></div>
    <button class="read" id="readLetter">✉ อ่านจดหมาย</button>
  </section>

  <!-- 4 LETTER -->
  <section class="scene" id="letter">
    <div class="wrap">
      <div class="card">
        <h2><small>HAPPY</small>Birthday</h2>
        <div id="letterText"></div>
        <button class="next" id="toCake">แตะตรงนี้ มีเซอร์ไพรส์ต่อ 🎁</button>
      </div>
      <div class="photos" id="photos"></div>
    </div>
    <div class="hearts" id="hearts"></div>
  </section>

  <!-- 5 CAKE -->
  <section class="scene" id="cake">
    <h2>✨ Make a Wish ✨</h2>
    <div class="cakebox" id="cakebox">
      <div class="candles">
        <div class="candle"><i class="flame"></i><i class="smoke"></i><i class="wick"></i></div>
        <div class="candle"><i class="flame"></i><i class="smoke"></i><i class="wick"></i></div>
        <div class="candle"><i class="flame"></i><i class="smoke"></i><i class="wick"></i></div>
      </div>
      <div class="tier t2"></div>
      <div class="tier t1"></div>
      <div class="plate"></div>
    </div>
    <div id="count"></div>
    <button id="go">เริ่มนับถอยหลัง</button>
    <div id="wishes"></div>
    <canvas id="fx"></canvas>
  </section>

  <script>
    /* ============ ตั้งค่าตรงนี้ ============ */
    const CONFIG = {
      passcode: "091147",           // วันเกิดแฟน แบบ DDMMYY เช่น 1 ม.ค. 2001 = "010101"
      nickname: "Daynew",             // ชื่อเล่นแฟน
      lockPhoto: "IMG_1351.JPG", // รูปโพลารอยด์หน้าแรก
      lockCaption: "Happy Birthday!",
      heroPhoto: "S__7217155.jpg", // รูปคู่เต็มจอหน้า Happy Birthday Baby!
      heroDate: "09 · 11 · 04",     // วันเกิดแฟน หรือวันที่อยากโชว์
      heroTitle: "Happy Birthday Babe! 🎉",
      heroSub: "หวังว่าของขวัญชิ้นเล็กๆ นี้จะทำให้แฮปปี้นะคับ ❤",
      photos: ["IMG_1520.JPG", "IMG_5601.JPG", "IMG_5552.JPEG"], // รูปข้างการ์ด
      letter: [
        "ถึงที่รักของเค้า\nเธอคือที่สุดของเค้า อ้วนเป็นเหตุผลที่เค้ายิ้มได้ทุกวัน ดีใจมากที่มีอ้วนอยู่ข้างๆ",
        "สุขสันต์วันเกิดนะค้าบ ขอให้ปีนี้เต็มไปด้วยความสุข เสียงหัวเราะ และเรื่องดีๆ ",
        "ไม่ว่าจะนานแค่ไหน เค้าจะอยู่ข้างเธอ ซัพพอร์ต และฉลองทุกความสำเร็จของเธอเสมอ",
        "สุขสันต์วันเกิดนะคะ ❤\nรักอ้วนนะ"
      ],
      wishes: ["ขอให้มีความสุขมากๆ ", "สุขภาพแข็งแรง ", "สมหวังทุกเรื่อง ", "เรารักอ้วนนะ ", "Happy Birthday! ",
        "ขอให้ยิ้มได้ทุกวัน ", "ขอให้ปังทุกอย่าง ", "ขอให้โชคดีตลอดปี ", "ขอให้เจอแต่เรื่องดีๆ ", "ขอให้รวยๆ เฮงๆ ",
        "ขอให้อยู่กับเค้านานๆ ", "ขอให้เจอแต่คนดีดี ", "ขอให้นอนหลับฝันดีทุกคืน ", "ขอให้กินเยอะๆ ", "สุขสันต์วันเกิดนะ ", "รักที่สุดเลย "],
      wishDuration: 25 // วินาทีที่คำอวยพรเด้งต่อเนื่อง
    };
    /* ====================================== */

    const $ = id => document.getElementById(id);
    const show = id => { document.querySelectorAll('.scene').forEach(s => s.classList.remove('on')); $(id).classList.add('on') };
    const bg = (el, src) => { const i = new Image(); i.onload = () => el.style.backgroundImage = `url(${src})`; i.src = src };

    // init content
    bg($('lockPhoto'), CONFIG.lockPhoto);
    bg($('hero'), CONFIG.heroPhoto);
    $('heroDate').textContent = CONFIG.heroDate;
    $('heroTitle').textContent = CONFIG.heroTitle;
    $('heroSub').innerHTML = CONFIG.heroSub.replace(/\n/g, '<br>');
    $('lockCaption').textContent = CONFIG.lockCaption + ' ' + CONFIG.nickname;
    $('hiText').textContent = 'Hey ' + CONFIG.nickname + '! 🎉';
    $('envTitle').innerHTML = 'Happy Birthday!<br>' + CONFIG.nickname;
    $('letterText').innerHTML = CONFIG.letter.map(t => `<p>${t}</p>`).join('');
    CONFIG.photos.forEach(src => { const d = document.createElement('div'); d.className = 'ph'; d.innerHTML = '<div></div>'; bg(d.firstChild, src); $('photos').appendChild(d) });

    // 1 passcode
    let code = ''; const L = CONFIG.passcode.length;
    $('dots').innerHTML = Array(L).fill('<i></i>').join('');
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].forEach(k => {
      const b = document.createElement('button'); b.textContent = k;
      if (!k) b.className = 'ghost', b.disabled = true;
      b.onclick = () => press(k); $('keys').appendChild(b)
    });
    function render() { [...$('dots').children].forEach((d, i) => { d.className = i < code.length ? 'f' : ''; d.textContent = i < code.length ? '•' : '' }) }
    function press(k) {
      if (!$('lock').classList.contains('on')) return;
      if (k === '⌫') code = code.slice(0, -1); else if (code.length < L) code += k;
      render(); $('hint').textContent = '';
      if (code.length === L) {
        if (code === CONFIG.passcode) { setTimeout(startLoad, 300) }
        else {
          $('dots').classList.add('shake'); $('hint').textContent = 'ยังไม่ใช่นะ ลองใหม่อีกที 💭';
          setTimeout(() => { $('dots').classList.remove('shake'); code = ''; render() }, 500)
        }
      }
    }
    document.addEventListener('keydown', e => { if (/^\d$/.test(e.key)) press(e.key); if (e.key === 'Backspace') press('⌫') });

    // 2 loading
    function startLoad() {
      show('load'); let p = 0;
      const t = setInterval(() => { p += Math.random() * 14; if (p >= 100) { p = 100; clearInterval(t); setTimeout(() => show('env'), 600) } $('barFill').style.width = p + '%' }, 300)
    }

    // 3 envelope
    $('envelope').onclick = function () { this.classList.add('open'); setTimeout(() => show('hero'), 1100) };
    $('readLetter').onclick = () => { show('letter'); hearts() };

    // 4 letter
    function hearts() {
      let n = 0; const t = setInterval(() => {
        if (!$('letter').classList.contains('on') || n++ > 40) return clearInterval(t);
        const s = document.createElement('span'); s.textContent = ['💖', '🌸', '💕'][n % 3]; s.style.left = Math.random() * 100 + 'vw'; s.style.fontSize = 14 + Math.random() * 16 + 'px';
        $('hearts').appendChild(s); setTimeout(() => s.remove(), 7000)
      }, 400)
    }
    $('toCake').onclick = () => show('cake');

    // 5 cake countdown + fireworks
    $('go').onclick = () => {
      $('go').style.display = 'none'; let n = 3; const c = $('count');
      const tick = () => {
        if (n > 0) { if (n === 1) $('cakebox').classList.add('blow'); c.textContent = n; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); n--; setTimeout(tick, 1000) }
        else { c.textContent = '🎉'; $('cakebox').classList.remove('blow'); $('cakebox').classList.add('out'); celebrate() }
      }; tick()
    };
    function celebrate() {
      const cols = ['#fff', '#ffd1e8', '#ffe9a8', '#d8c8ff', '#c9f2ff']; let n = 0;
      const wt = setInterval(() => {
        const d = document.createElement('div'); d.className = 'wish'; d.textContent = CONFIG.wishes[n++ % CONFIG.wishes.length];
        d.style.left = (22 + Math.random() * 56) + '%'; d.style.top = (6 + Math.random() * 80) + '%';
        d.style.fontSize = (22 + Math.random() * 16) + 'px'; d.style.color = cols[n % cols.length];
        $('wishes').appendChild(d); setTimeout(() => d.remove(), 4600);
        if (n >= CONFIG.wishDuration * 3) clearInterval(wt)
      }, 330);
      let k = 0; const t = setInterval(() => { burst(Math.random() * innerWidth, Math.random() * innerHeight * .6 + 40); if (++k > CONFIG.wishDuration * 3) clearInterval(t) }, 330);
      loop();
    }
    const cv = $('fx'), cx = cv.getContext('2d'); let parts = [], running = false;
    function fit() { cv.width = innerWidth; cv.height = innerHeight } fit(); addEventListener('resize', fit);
    function burst(x, y) {
      const h = Math.random() * 360; for (let i = 0; i < 70; i++) {
        const a = Math.random() * 6.283, s = Math.random() * 5 + 1;
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, h: h + Math.random() * 40 })
      }
    }
    function loop() {
      if (running) return; running = true; (function f() {
        cx.globalCompositeOperation = 'destination-out'; cx.fillStyle = 'rgba(0,0,0,.2)'; cx.fillRect(0, 0, cv.width, cv.height); cx.globalCompositeOperation = 'lighter';
        parts = parts.filter(p => p.life > 0);
        parts.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += .05; p.vx *= .985; p.life -= .012;
          cx.fillStyle = `hsla(${p.h},100%,65%,${p.life})`; cx.beginPath(); cx.arc(p.x, p.y, 2.2, 0, 6.283); cx.fill()
        });
        requestAnimationFrame(f)
      })()
    }
  </script>
</body>

</html>
